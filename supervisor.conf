[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/root/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
pidfile=/var/run/supervisord.pid
childlogdir=/root/log/supervisor
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ------------------------------------------------------------------------------
; Application Services
; ------------------------------------------------------------------------------

[program:xvfb]
command=bash -c "rm -f /tmp/.X99-lock; Xvfb :99 -screen 0 1920x1080x24@120"
autostart=true
autorestart=true
priority=10
stdout_logfile=/root/log/xvfb.out.log
stderr_logfile=/root/log/xvfb.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5

[program:fluxbox]
command=fluxbox -display :99
autostart=true
autorestart=true
priority=20
environment=DISPLAY=":99"
stdout_logfile=/root/log/fluxbox.out.log
stderr_logfile=/root/log/fluxbox.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5

[program:x11vnc]
command=x11vnc -display :99 -nopw -forever -shared -rfbport 5900
autostart=true
autorestart=true
priority=30
environment=DISPLAY=":99"
stdout_logfile=/root/log/x11vnc.out.log
stderr_logfile=/root/log/x11vnc.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5

[program:novnc]
command=websockify --web /usr/share/novnc/ 6080 localhost:5900
autostart=true
autorestart=true
priority=40
stdout_logfile=/root/log/novnc.out.log
stderr_logfile=/root/log/novnc.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5

[program:cloakbrowser]
command=bash -c 'rm /root/.config/google-chrome-ai/Singleton*; python3 -u -m app.browser_profile; /root/.cloakbrowser/chromium-146.0.7680.177.5/chrome --no-sandbox --disable-dev-shm-usage --start-maximized --display=:99 --window-size=1920,1080 --window-position=0,0 --remote-debugging-port=9222 --user-data-dir=/root/.config/google-chrome-ai --fingerprint=26020 --fingerprint-platform=linux --ignore-gpu-blocklist --fingerprint-timezone=${TZ:-UTC} --fingerprint-locale=en-US --lang=en-US'
autostart=true
autorestart=true
priority=50
environment=DISPLAY=":99",PYTHONPATH="/app"
stdout_logfile=/root/log/chrome.out.log
stderr_logfile=/root/log/chrome.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5

[program:cdp-forwarder]
command=bash -c 'sleep 3 && socat TCP-LISTEN:9223,fork,reuseaddr TCP:127.0.0.1:9222'
autostart=true
autorestart=true
priority=60
stdout_logfile=/root/log/cdp-forwarder.out.log
stderr_logfile=/root/log/cdp-forwarder.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5

[program:main-server]
command=bash -c 'set -a; . /app/.env; set +a; exec python3 -u -P /app/app/main.py'
environment=PYTHONPATH="/app"
autostart=true
autorestart=true
priority=100
stdout_logfile=/root/log/main-server.out.log
stderr_logfile=/root/log/main-server.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5

[program:resources-gc]
command=bash -c 'set -a; . /app/.env; set +a; while true; do python3 -u -m app.garbage_collector_cli; sleep 86400; done'
environment=PYTHONPATH="/app"
autostart=true
autorestart=true
priority=110
stdout_logfile=/root/log/resources-gc.out.log
stderr_logfile=/root/log/resources-gc.err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
