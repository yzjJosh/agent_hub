<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" aria-labelledby="title description">
  <title id="title">Your assistants, one personal tool hub</title>
  <desc id="description">MCP clients such as Hermes, Claude Code, Codex, and OpenClaw independently call Agent Hub, with results returning to each caller. Agent Hub is one personal hub for a browser, connected services, and embedded workflows, with shared browser state, files, and history. Model, media, and voice backends are separate deployments.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#8298b2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #192e49; text-anchor: middle; }
      .label { font-size: 25px; font-weight: 600; }
      .detail { font-size: 24px; fill: #52677f; }
      .connection { fill: none; stroke: #8298b2; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="800" height="540" rx="24" fill="#fff"/>
  <g class="label">
    <rect x="24" y="24" width="173" height="64" rx="13" fill="#fff" stroke="#d5dee9"/>
    <text x="110.5" y="64">Hermes</text>
    <rect x="217" y="24" width="173" height="64" rx="13" fill="#fff" stroke="#d5dee9"/>
    <text x="303.5" y="64">Claude Code</text>
    <rect x="410" y="24" width="173" height="64" rx="13" fill="#fff" stroke="#d5dee9"/>
    <text x="496.5" y="64">Codex</text>
    <rect x="603" y="24" width="173" height="64" rx="13" fill="#fff" stroke="#d5dee9"/>
    <text x="689.5" y="64">OpenClaw</text>
  </g>
  <g class="connection">
    <path d="M110.5 99 V151"/>
    <path d="M303.5 99 V151"/>
    <path d="M496.5 99 V151"/>
    <path d="M689.5 99 V151"/>
  </g>
  <text x="400" y="134" class="detail">MCP</text>
  <rect x="24" y="164" width="752" height="208" rx="24" fill="#f0f6ff" stroke="#b6cce5" stroke-width="1.5"/>
  <text x="400" y="215" font-size="36" font-weight="700">Agent Hub</text>
  <text x="400" y="248" class="detail">Personal hub</text>
  <g class="label">
    <text x="150" y="298">Browser</text>
    <text x="400" y="298">Services</text>
    <text x="650" y="298">Workflows</text>
  </g>
  <text x="400" y="344" class="detail">Shared browser · files · history</text>
  <path d="M400 384 V426" class="connection"/>
  <rect x="120" y="439" width="560" height="77" rx="16" fill="#f7fafc" stroke="#d4e0eb"/>
  <text x="400" y="470" class="label">Separate backends</text>
  <text x="400" y="500" class="detail">Models · media · voice</text>
</svg>
